<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>鏡海導覽 · 第二禮 月門補字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#game{position:fixed;top:0;left:0;width:100%;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow:hidden}

/* 背景層：媽閣街 / 鄭家大屋 / 月門外廊 */
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:1;opacity:0;transition:opacity .8s ease}
.bg.show{opacity:1}
.bg::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.7) 100%)}
.bg-a{background-image:url('bg_magai_street.jpg')}
.bg-b{background-image:url('bg_zheng_house.jpg')}
.bg-moon{background-image:url('bg_moon_gate.jpg')}

/* 地點標籤 */
.loc-label{position:absolute;top:calc(env(safe-area-inset-top,0px) + 24px);left:50%;transform:translateX(-50%);background:rgba(28,24,20,.85);border:1px solid rgba(212,168,87,.5);border-radius:999px;padding:8px 20px;color:#d4a857;font-size:13px;font-weight:700;letter-spacing:2px;z-index:5;opacity:0;transition:opacity .6s ease;white-space:nowrap}
.loc-label.show{opacity:1}

/* 旁白 */
.narration{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);left:24px;right:24px;color:#e8e0d0;font-size:17px;line-height:1.8;text-shadow:0 2px 8px rgba(0,0,0,.9);opacity:0;transition:opacity .4s ease;z-index:5;min-height:60px}
.narration.show{opacity:1}

/* 點擊提示 */
.dialog-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:#d4a857;font-size:15px;font-weight:700;letter-spacing:2px;opacity:0;transition:opacity .4s ease;z-index:26;animation:hintBlink 1.2s ease-in-out infinite;pointer-events:none}
.dialog-hint.show{opacity:1}
@keyframes hintBlink{0%,100%{opacity:.3}50%{opacity:1}}

/* 紙條（空白樣式） */
.letter{
  position:absolute;
  left:50%;top:52%;
  width:86%;max-width:340px;
  transform:translate(-50%,-38%) rotate(-2deg) scale(.92);
  background:
    repeating-linear-gradient(0deg,rgba(120,90,40,.04) 0px,rgba(120,90,40,.04) 1px,transparent 1px,transparent 3px),
    linear-gradient(135deg,#f3e7c6 0%,#e7d6a8 45%,#d9c490 100%);
  border:1px solid rgba(150,110,60,.55);
  border-radius:5px;
  box-shadow:
    inset 0 0 34px rgba(120,80,30,.28),
    inset 0 0 5px rgba(160,120,60,.35),
    0 14px 44px rgba(0,0,0,.55);
  padding:30px 24px 34px;
  aspect-ratio:10/13;
  opacity:0;
  z-index:20;
  transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1.2);
  pointer-events:none;
}
.letter.show{opacity:1;transform:translate(-50%,-50%) rotate(-1.5deg) scale(1)}
/* 折痕暗線 */
.letter::before{
  content:'';position:absolute;left:0;right:0;top:46%;
  height:1px;
  background:linear-gradient(to right,transparent,rgba(120,90,40,.22) 30%,rgba(120,90,40,.22) 70%,transparent);
  box-shadow:0 2px 4px rgba(120,90,40,.08);
}
/* 燒焦邊緣 */
.letter::after{
  content:'';position:absolute;inset:0;border-radius:5px;
  box-shadow:inset 0 0 12px rgba(90,60,20,.35);
}
.letter-title{height:34px}
.letter-body{height:calc(100% - 44px);margin-top:10px}

/* 紙條上的詩句 */
.letter-body{
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;
  font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
  color:#5a4630;text-shadow:0 1px 0 rgba(255,245,220,.35);
}
.pline{opacity:0;transform:translateY(6px);transition:opacity .55s ease,transform .55s ease;font-size:19px;letter-spacing:3px;line-height:1.6}
.pline.show{opacity:1;transform:translateY(0)}
.pblur{display:inline-block;width:2em;height:1.12em;vertical-align:bottom;border-radius:2px;
  background:linear-gradient(115deg,rgba(120,90,40,.32),rgba(120,90,40,.08) 55%,rgba(120,90,40,.26));
  filter:blur(1.2px);box-shadow:inset 0 0 4px rgba(90,60,20,.35)}
/* 缺漏處輸入框 */
.pinput{
  display:inline-block;width:2.2em;height:1.42em;text-align:center;vertical-align:bottom;
  background:rgba(120,90,40,.14);border:none;border-bottom:2px solid rgba(120,90,40,.55);
  border-radius:3px;font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
  font-size:19px;color:#5a4630;outline:none;caret-color:#b8860b;
  -webkit-user-select:text;user-select:text;
  pointer-events:auto;
}
.pinput:focus{border-bottom-color:#b8860b;background:rgba(180,140,60,.2);box-shadow:0 2px 10px rgba(180,140,60,.3)}
.pinput.wrong{animation:shake .4s ease;border-bottom-color:#b0342e;background:rgba(176,52,46,.12)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* 確認按鈕 */
.letter-confirm{
  margin-top:8px;padding:8px 36px;font-size:15px;letter-spacing:6px;color:#f5e6c8;
  background:rgba(140,30,20,.92);border:none;border-radius:999px;
  box-shadow:0 3px 12px rgba(0,0,0,.35);font-family:inherit;font-weight:700;
  pointer-events:auto;
}
".letter-confirm:active{transform:scale(.96)}
/* 三層提示（按鈕上掛剩餘次數） */
.hint-row{display:flex;justify-content:center;margin-top:2px}
.hint-btn{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  padding:5px 15px 5px 9px;font-size:13px;letter-spacing:2px;color:#7a5a2a;
  background:rgba(120,90,40,.10);border:1px solid rgba(120,90,40,.45);border-radius:999px;
  font-family:inherit;font-weight:600;cursor:pointer;pointer-events:auto;
  transition:background .2s,opacity .2s,transform .15s;
}
.hint-btn:hover{background:rgba(120,90,40,.18)}
.hint-btn:active{transform:scale(.97)}
.hint-btn.done{opacity:.45;cursor:default}
.hint-badge{
  min-width:18px;height:18px;line-height:18px;padding:0 4px;border-radius:999px;
  background:#8c1e14;color:#f5e6c8;font-size:11px;font-weight:700;letter-spacing:0;
  text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.hint-badge.zero{background:rgba(120,90,40,.40)}
.hint-text{
  max-width:88%;min-height:1.9em;margin:2px auto 0;font-size:13.5px;line-height:1.7;letter-spacing:1px;
  color:#7a5a2a;text-align:center;text-shadow:none;
  opacity:0;transform:translateY(4px);transition:opacity .35s ease,transform .35s ease;
}
.hint-text.show{opacity:1;transform:translateY(0)}
/* 小屏（如 375×667）：紙條收窄、行距收緊，避免壓到下方旁白 */
@media (max-height:700px){
  .letter{width:80%;max-width:330px;top:47%;padding:20px 16px 24px}
  .letter-body{gap:9px}
  .pline{font-size:17px;letter-spacing:2px;line-height:1.45}
  .pinput{font-size:17px}
  .letter-confirm{padding:7px 30px;font-size:14px;letter-spacing:4px}
  .hint-text{font-size:12.5px;line-height:1.55;min-height:1.7em}
  .letter-title{height:26px}
  .letter-body{height:calc(100% - 36px);margin-top:6px}
}
/* 答對補字 */
.panswer{display:inline-block;color:#b8860b;font-weight:700;text-shadow:0 0 12px rgba(184,134,11,.55)}
.panswer.pop{animation:inkPop .5s ease}
@keyframes inkPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
/* 字序翻轉：鏡海 → 海鏡 */
.panswer .ch{display:inline-block;transition:transform 1.1s cubic-bezier(.3,1.4,.4,1)}
.panswer .ch.swap:nth-child(1){transform:translateX(1.08em) rotate(5deg)}
.panswer .ch.swap:nth-child(2){transform:translateX(-1.08em) rotate(-5deg)}
/* 答錯提示 */
.wrong-hint{color:#b0342e;font-size:13px;letter-spacing:1px;text-shadow:none;margin-top:2px}

/* 鄭觀應立繪（左側滑入，透明底 PNG） */
.zheng-portrait{
  position:absolute;left:0;bottom:0;height:56%;max-height:460px;
  transform:translateX(-102%);
  transition:transform .7s cubic-bezier(.2,.8,.3,1);
  z-index:22;pointer-events:none;
}
.zheng-portrait.show{transform:translateX(0)}
/* 鄭觀應對話框 */
.dialog-zheng{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:12px;right:12px;
  background:rgba(28,24,20,.95);border:1px solid rgba(212,168,87,.5);border-radius:10px;
  padding:12px 14px;z-index:25;opacity:0;transform:translateY(16px);
  transition:opacity .45s ease,transform .45s ease;pointer-events:none;min-height:88px;
}
.dialog-zheng.show{opacity:1;transform:translateY(0)}
.dialog-zheng-name{color:#d4a857;font-size:15px;font-weight:700;margin-bottom:6px}
.dialog-zheng-text{color:#e8dcc8;font-size:15px;line-height:1.65}

/* 歷史紙條（鏡海三鏡） */
.hist-card{
  position:absolute;left:50%;top:50%;
  width:88%;max-width:340px;max-height:72vh;
  transform:translate(-50%,-50%) scale(.92) rotate(-1.5deg);
  background:
    repeating-linear-gradient(0deg,rgba(120,90,40,.04) 0px,rgba(120,90,40,.04) 1px,transparent 1px,transparent 3px),
    linear-gradient(135deg,#f3e7c6 0%,#e7d6a8 45%,#d9c490 100%);
  border:1px solid rgba(150,110,60,.55);border-radius:5px;
  box-shadow:
    inset 0 0 34px rgba(120,80,30,.28),
    inset 0 0 5px rgba(160,120,60,.35),
    0 14px 44px rgba(0,0,0,.6);
  padding:24px 22px 26px;
  opacity:0;pointer-events:none;z-index:26;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.3,1.15);
  display:flex;flex-direction:column;
  font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
}
.hist-card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1) rotate(-1.5deg)}
.hist-title{text-align:center;color:#7a5426;font-weight:700;font-size:16px;letter-spacing:3px;margin-bottom:14px}
.hist-body{overflow-y:auto;color:#5a4630;font-size:14px;line-height:1.75}
.hist-layer{margin-bottom:12px;text-indent:2em}
.hist-layer-t{display:block;text-indent:0;font-weight:700;color:#7a4a1a;margin-bottom:2px}
.hist-btn{
  margin:14px auto 0;padding:8px 30px;font-size:14px;letter-spacing:4px;
  color:#5a4630;background:rgba(120,90,40,.16);
  border:1px solid rgba(120,90,40,.4);border-radius:999px;font-family:inherit;
}
.hist-btn:active{transform:scale(.96)}
/* 📖 知識圖標（縮入左側） */
.hist-tab{
  position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 42%);
  width:44px;height:44px;border-radius:50%;
  background:rgba(28,24,20,.85);border:1px solid rgba(212,168,87,.55);
  font-size:20px;align-items:center;justify-content:center;
  z-index:26;display:none;opacity:0;transition:opacity .4s ease;
}
.hist-tab.show{display:flex;opacity:1}

/* 月門內的月亮（緩緩顯現） */
.moon{
  position:absolute;left:58.3%;top:56.7%;z-index:3;
  width:42vmin;height:42vmin;margin-left:-21vmin;margin-top:-21vmin;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fffdf4 0%,#fbf0c8 52%,#ecd89a 100%);
  box-shadow:
    0 0 42px rgba(255,242,190,.95),
    0 0 110px rgba(255,228,150,.45),
    inset -6px -8px 22px rgba(210,180,90,.35);
  opacity:0;transform:scale(.55);
  transition:opacity 3.2s ease,transform 3.2s cubic-bezier(.2,.8,.3,1);
  pointer-events:none;
}
/* 月亮下部：孩童夜讀（透明PNG） */
.kids{
  position:absolute;left:50%;margin-left:-19vmin;top:69%;
  width:38vmin;height:30vmin;z-index:4;
  opacity:0;
  transition:opacity 1.6s ease;
  pointer-events:none;
}
.kids.show{opacity:1}
/* 孩童夜讀圖向右滑出消失 */
.kids.away{
  transform:translateX(55vmin);
  opacity:0;
  transition:transform .9s ease-in,opacity .9s ease-in;
}
/* 月亮中央：郤詵立繪（透明PNG，全身像浮現於月心） */
.shen{
  position:absolute;left:58.3%;top:56.7%;z-index:5;
  width:24.7vmin;height:42vmin;margin-left:-12.35vmin;margin-top:-21vmin;
  object-fit:contain;
  opacity:0;
  transition:opacity 2.6s ease;
  pointer-events:none;
}
.shen.show{opacity:1}
/* 郤詵快速縮小到月亮頂緣並緩緩消失 */
.shen.away{
  transform:translate(0,-15vmin) scale(.12);
  opacity:0;
  transition:transform .8s cubic-bezier(.5,0,.75,.4),opacity 2.6s ease;
}
/* 月亮頂緣輪廓：桂花樹樹根精確貼合月緣（樹根 Y≈35.7%=月頂緣，樹冠伸出月輪） */
.gui{
  position:absolute;left:58.3%;top:22%;z-index:5;
  width:26vmin;height:34.7vmin;margin-left:-13vmin;margin-top:-17.35vmin;
  object-fit:contain;
  opacity:0;transform:scale(.25);
  transition:opacity 1.8s ease,transform 1.8s cubic-bezier(.2,.9,.3,1.1);
  pointer-events:none;
}
.gui.show{opacity:1;transform:scale(1)}
/* 月亮中央：折桂二字 */
.zhegui{
  position:absolute;left:58.3%;top:56.7%;z-index:6;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12.5vmin;line-height:1.15;
  font-weight:900;color:#3a2812;
  text-shadow:0 0 18px rgba(255,244,200,.9),0 0 42px rgba(255,230,160,.5);
  opacity:0;
  transition:opacity 1.2s ease;
  pointer-events:none;
}
.zhegui.show{opacity:1}
.moon.show{opacity:1;transform:scale(1)}
/* 月亮表面的淡斑（增加月面質感） */
.moon::before{
  content:'';position:absolute;left:24%;top:30%;width:12%;height:12%;border-radius:50%;
  background:rgba(210,185,110,.35);filter:blur(2px);
}
.moon::after{
  content:'';position:absolute;right:22%;bottom:26%;width:18%;height:18%;border-radius:50%;
  background:rgba(215,190,115,.3);filter:blur(3px);
}

/* 輕觸開始過場（解鎖音頻自動播放） */
.start-overlay{
  position:absolute;inset:0;z-index:60;
  background:rgba(0,0,0,.55);
  display:none;align-items:center;justify-content:center;
}
.start-text{
  color:#e8dcc8;font-size:16px;letter-spacing:5px;font-weight:700;
  animation:hintBlink 1.4s ease-in-out infinite;
}

/* 音量開關（常駐，BGM 與配音共用） */
.volume-btn{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);right:14px;
  width:44px;height:44px;border-radius:50%;padding:0;
  background:rgba(28,24,20,.85);border:1px solid rgba(212,168,87,.55);
  color:#d4a857;font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  z-index:61;cursor:pointer;
  transition:transform .15s ease,color .2s ease,border-color .2s ease;
}
.volume-btn:active{transform:scale(.94)}
.volume-btn.muted{color:rgba(212,168,87,.45);border-color:rgba(212,168,87,.28)}

/* 導航按鈕（台詞上方，點擊打開百度地圖導航到鄭家大屋） */
.nav-btn{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);
  transform:translate(-50%,8px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:999px;
  background:rgba(28,24,20,.9);border:1px solid rgba(212,168,87,.6);
  color:#e8dcc8;font-size:14px;font-weight:700;letter-spacing:1px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  z-index:24;white-space:nowrap;
  transition:opacity .35s ease,transform .35s ease;
}
.nav-btn.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.nav-btn:active{transform:translate(-50%,0) scale(.96)}
.nav-btn .nav-ico{color:#d4a857;font-size:15px;line-height:1}

/* 導航面板：只佔螢幕 1/3，底部彈出，下方「我已到達」 */
.nav-mask{
  position:absolute;inset:0;z-index:45;display:none;align-items:flex-end;
  background:rgba(0,0,0,.42);
}
.nav-mask.show{display:flex}
.nav-sheet{
  width:100%;height:66.67vh;min-height:420px;
  background:rgba(19,16,13,.97);
  border-top:1px solid rgba(212,168,87,.55);
  border-radius:16px 16px 0 0;
  box-shadow:0 -12px 36px rgba(0,0,0,.55);
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column;gap:7px;
  animation:sheetUp .32s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.nav-head{display:flex;align-items:baseline;gap:8px}
.nav-head b{color:#d4a857;font-size:15px;font-weight:700;letter-spacing:2px}
.nav-head span{color:rgba(232,220,200,.58);font-size:11.5px;letter-spacing:.5px}
.nav-map{
  position:relative;flex:1;min-height:70px;border-radius:8px;overflow:hidden;
  border:1px solid rgba(120,90,40,.5);background:#efe2c2;
}
.nav-map svg{display:block;width:100%;height:100%}
/* 實時百度瓦片地圖（免 AK，內嵌在 1/3 面板裡，可拖動縮放） */
.bm-tiles{position:absolute;inset:0;overflow:hidden;background:#f3ecdc;z-index:2;
  touch-action:none;cursor:grab}
.bm-tiles.dragging{cursor:grabbing}
.bm-tiles img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bm-ctrl{position:absolute;right:7px;bottom:7px;display:flex;flex-direction:column;gap:5px;z-index:5}
.bm-btn{width:25px;height:25px;padding:0;border-radius:7px;border:1px solid rgba(120,90,40,.55);
  background:rgba(255,252,244,.94);color:#4b3a22;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.bm-btn:active{background:#e8d9b8}
.bm-attr{position:absolute;left:6px;bottom:5px;z-index:5;font-size:9px;color:#5b5245;
  background:rgba(255,255,255,.78);padding:1px 5px;border-radius:3px;pointer-events:none}
/* 靜態底圖：只在瓦片拉不到時露出來 */
.nav-map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
/* 目的地圖釘 */
.nav-pin{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:6;
}
.nav-pin-label{
  background:rgba(19,16,13,.86);border:1px solid rgba(212,168,87,.75);
  color:#f0e4cc;font-size:10.5px;letter-spacing:.6px;padding:2px 8px;border-radius:999px;
  white-space:nowrap;margin-bottom:5px;
}
.nav-pin-dot{
  width:11px;height:11px;border-radius:50%;background:#c9432c;border:2px solid #fff6e2;
  box-shadow:0 2px 8px rgba(0,0,0,.45);position:relative;
}
.nav-pin-dot::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1.5px solid rgba(201,67,44,.55);animation:pinPulse 2s ease-out infinite;
}
@keyframes pinPulse{0%{transform:scale(.7);opacity:.85}70%{transform:scale(1.7);opacity:0}100%{opacity:0}}
.nav-tip{color:rgba(232,220,200,.6);font-size:11.5px;letter-spacing:.6px}
.nav-arrive{
  width:100%;padding:12px 0;border:none;border-radius:999px;

<script>
let typeTimer=null,currentText='',currentEl=null,currentDone=null;

// 打完（或跳過）後執行一次回調，用於「台詞結束才出現」的 UI
function finishType(){
  if(currentDone){const cb=currentDone;currentDone=null;cb();}
}

function typeWriter(el,text,onDone){
  clearInterval(typeTimer);
  currentDone=null;
  el.textContent='';
  currentEl=el;
  currentText=text;
  currentDone=onDone||null;
  let i=0;
  typeTimer=setInterval(()=>{
    if(i<text.length){el.textContent+=text[i];i++;}
    else{clearInterval(typeTimer);typeTimer=null;finishType();}
  },60);
}

function skipTypewriter(){
  if(typeTimer){
    clearInterval(typeTimer);
    typeTimer=null;
    currentEl.textContent=currentText;
    finishType();
  }
}

// 配音淡出：舊聲在背景約 0.3s 漸降暫停，回調立即執行（新聲立刻起播）。
// 不再等淡出結束才回調，避免快速連點時新聲尚未進入下一次淡出快照、造成兩聲重疊
function fadeAndStop(cb){
  fadeAudios(['vo1','vo2','vo3','vo4','vo5','vo6'],cb);
}

/* 提示令牌：切句/隱藏即作廢在途的提示定時器，防止快速連點後舊回調回頭誤亮 */
let hintToken=0;
function scheduleHint(ms){
  const token=++hintToken;
  setTimeout(function(){
    if(token===hintToken) document.getElementById('dlgHint').classList.add('show');
  },ms);
}
function hideHint(){
  hintToken++;
  document.getElementById('dlgHint').classList.remove('show');
}

/* ============ 音頻：全篇單一 BGM + 音量開關 ============ */
const BGM_VOL=0.18;          // BGM 基準音量（低於配音，不搶戲）
let audioMuted=false;        // 全域靜音狀態
const BGM_KEY='moongateBgmState';
let bgmReady=false;   // 還原完成前不寫入，避免覆蓋前一頁狀態

// 跨頁延續：把 BGM 播放位置與靜音狀態寫入 sessionStorage
function saveBgmState(){
  if(!bgmReady)return;
  const bgm=document.getElementById('bgm');
  if(!bgm)return;
  try{
    sessionStorage.setItem(BGM_KEY,JSON.stringify({
      t:bgm.currentTime,
      muted:audioMuted,
      file:bgm.src.split('/').pop()
    }));
  }catch(e){}
}
function readBgmState(){
  try{
    const raw=sessionStorage.getItem(BGM_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null;}
}

// 啟動 BGM：先嘗試自動播放，被瀏覽器攔截時於首次手勢補播
function startBgm(){
  const bgm=document.getElementById('bgm');
  if(!bgm)return;
  bgm.volume=BGM_VOL;
  // 接軌前一頁：同一條音軌才還原靜音與播放位置
  const st=readBgmState();
  if(st&&st.file==='bgm_moongate.wav'){
    audioMuted=!!st.muted;
    const seek=function(){
      if(isFinite(st.t)&&st.t>=0&&isFinite(bgm.duration)&&st.t<bgm.duration){
        bgm.currentTime=st.t;
      }
    };
    if(bgm.readyState>=1){seek();}
    else{bgm.addEventListener('loadedmetadata',seek,{once:true});}
  }
  applyMute();
  bgmReady=true;
  const p=bgm.play();
  if(p&&typeof p.catch==='function'){
    p.catch(function(){
      const once=function(){
        document.removeEventListener('pointerdown',once);
        document.removeEventListener('click',once);
        resumeBgm();
      };
      document.addEventListener('pointerdown',once);
      document.addEventListener('click',once);
    });
  }
}

function resumeBgm(){
  const bgm=document.getElementById('bgm');
  if(!bgm)return;
  bgm.volume=BGM_VOL;
  if(bgm.paused){bgm.play().catch(function(){});}
}

// 套用靜音狀態到所有音軌（BGM + 全部配音），不影響計時與劇情推進
function applyMute(){
  document.querySelectorAll('audio').forEach(function(a){a.muted=audioMuted;});
  const btn=document.getElementById('volumeBtn');
  if(!btn)return;
  btn.textContent=audioMuted?'🔇':'🔊';
  btn.classList.toggle('muted',audioMuted);
  btn.setAttribute('aria-pressed',audioMuted?'true':'false');
}

function toggleVolume(){
  audioMuted=!audioMuted;
  applyMute();
  // 點按本身即為手勢，順帶確保 BGM 已啟動
  resumeBgm();
}

(function bindVolumeBtn(){
  const btn=document.getElementById('volumeBtn');
  if(!btn)return;
  // 阻止冒泡，避免點音量鍵被當成「點擊繼續」推進劇情
  btn.addEventListener('pointerdown',function(e){e.stopPropagation();});
  btn.addEventListener('click',function(e){e.stopPropagation();toggleVolume();});
})();

// 持續記錄位置，跳轉時於 pagehide 再存一次，供下一頁接軌
(function bindBgmSave(){
  const bgm=document.getElementById('bgm');
  if(!bgm)return;
  bgm.addEventListener('timeupdate',saveBgmState);
  bgm.addEventListener('pause',saveBgmState);
  window.addEventListener('pagehide',saveBgmState);
  window.addEventListener('beforeunload',saveBgmState);
})();

function showNav(){}
function hideNav(){}

function initMoonGate(){
  // 進入月門段，導航鍵回到台詞（對話框）上方
  showNav();
  // BGM 自第一段起已持續循環，此處僅確保仍在播放，不重新起播
  const bgm=document.getElementById('bgm');
  bgm.volume=BGM_VOL;
  if(bgm.paused){bgm.play().catch(()=>{});}
  // 播放第一句配音（用戶手勢解鎖）
  const vo=document.getElementById('vo1');
  vo.currentTime=0;
  vo.play().catch(()=>{});
  // 場景標籤
  setTimeout(()=>{document.getElementById('locLabel').classList.add('show');},900);
  // 鄭觀應立繪滑入＋對話框＋第一句台詞
  setTimeout(()=>{
    document.getElementById('zhengPortrait').classList.add('show');
    document.getElementById('zhengName').textContent='鄭觀應';
    document.getElementById('zhengDialog').classList.add('show');
    typeWriter(document.getElementById('zhengText'),'你可知，這是一道什麼門？');
    // 第一句配音播完後才顯示點擊提示（避免配音被中途點擊掐斷）
    scheduleHint(Math.max((document.getElementById('vo1').duration||0)*1000,'你可知，這是一道什麼門？'.length*60+300));
    // 點擊：補完打字 → 接第二句台詞（延遲到此時註冊，避免開場手勢誤觸發）
    document.addEventListener('click',function onClick1(){
    if(typeTimer){
      skipTypewriter();
    }else{
      document.removeEventListener('click',onClick1);
      hideHint();
      // 月亮在月門內緩緩顯現
      document.getElementById('moon').classList.add('show');
      // 播放第二句配音（舊聲淡出後接入）
      fadeAndStop(function(){
        const vo2=document.getElementById('vo2');
        vo2.currentTime=0;
        vo2.play().catch(()=>{});
      });
      typeWriter(document.getElementById('zhengText'),'看看它的形狀，是不是很像一個月亮');
      // 第二句配音播完後才顯示點擊提示
      scheduleHint(Math.max((document.getElementById('vo2').duration||0)*1000,'看看它的形狀，是不是很像一個月亮'.length*60+300));
      // 點擊：補完打字 → 接第三句台詞
      document.addEventListener('click',function onClick2(){
        if(typeTimer){
          skipTypewriter();
        }else{
          document.removeEventListener('click',onClick2);
          hideHint();
          // 播放第三句配音（舊聲淡出後接入）
          fadeAndStop(function(){
            const vo3=document.getElementById('vo3');
            vo3.currentTime=0;
            vo3.play().catch(()=>{});
          });
          typeWriter(document.getElementById('zhengText'),'這就叫「月門」，我們的古建築講究一個「圓」。「圓」既代表天，也代表了圓滿，');
          // 第三句配音播完後才顯示點擊提示
          scheduleHint(Math.max((document.getElementById('vo3').duration||0)*1000,'這就叫「月門」，我們的古建築講究一個「圓」。「圓」既代表天，也代表了圓滿，'.length*60+300));
          // 點擊：補完打字 → 接第四句台詞＋孩童夜讀圖淡入
          document.addEventListener('click',function onClick3(){
            if(typeTimer){
              skipTypewriter();
            }else{
              document.removeEventListener('click',onClick3);
              hideHint();
              // 月亮下部：孩子們讀書的樣子淡入
              document.getElementById('kids').classList.add('show');
              // 播放第四句配音（舊聲淡出後接入）
              fadeAndStop(function(){
                const vo4=document.getElementById('vo4');
                vo4.currentTime=0;
                vo4.play().catch(()=>{});
              });
              typeWriter(document.getElementById('zhengText'),'我把月門立在文昌廳外廊 —— 這裡正是我輩族人讀書的所在');
              // 第四句配音播完後才顯示點擊提示
              scheduleHint(Math.max((document.getElementById('vo4').duration||0)*1000,'我把月門立在文昌廳外廊 —— 這裡正是我輩族人讀書的所在'.length*60+300));
              // 點擊：補完打字 → 接第五句台詞＋郤詵立繪在月心浮現
              document.addEventListener('click',function onClick4(){
                if(typeTimer){
                  skipTypewriter();
                }else{
                  document.removeEventListener('click',onClick4);
                  hideHint();
                  // 孩童夜讀圖向右滑出消失
                  document.getElementById('kids').classList.add('away');
                  // 月亮中央：郤詵立繪緩緩浮現
                  document.getElementById('shen').classList.add('show');
                  // 播放第五句配音（舊聲淡出後接入）
                  fadeAndStop(function(){
                    const vo5=document.getElementById('vo5');
                    vo5.currentTime=0;
                    vo5.play().catch(()=>{});
                  });
                  typeWriter(document.getElementById('zhengText'),'西晉有個著名的大臣曾經謙虛的表示：自己不過是「月中桂林的一根枝條」。');
                  // 第五句配音播完後才顯示點擊提示
                  scheduleHint(Math.max((document.getElementById('vo5').duration||0)*1000,'西晉有個著名的大臣曾經謙虛的表示：自己不過是「月中桂林的一根枝條」。'.length*60+300));
                  // 點擊：補完打字 → 接第六句動畫（郤詵退場→桂樹長出→月心「折桂」）
                  document.addEventListener('click',function onClick5(){
                    if(typeTimer){
                      skipTypewriter();
                    }else{
                      document.removeEventListener('click',onClick5);
                      hideHint();
                      // 郤詵快速縮小到月緣右上並緩緩消失
                      document.getElementById('shen').classList.add('away');
                      // 播放第六句配音（舊聲淡出後接入）
                      fadeAndStop(function(){
                        const vo6=document.getElementById('vo6');
                        vo6.currentTime=0;
                        vo6.play().catch(()=>{});
                      });
                      // 0.9s 後桂花樹在右上長出
                      setTimeout(()=>{document.getElementById('gui').classList.add('show');},900);
                      // 1.4s 後月亮中央浮現「折桂」
                      setTimeout(()=>{document.getElementById('zhegui').classList.add('show');},1400);
                      typeWriter(document.getElementById('zhengText'),'自此之後，古人便把科舉登第叫作「折桂」。',function(){
                        // 末句打完：點擊直接進入缺字場景，不再黑幕轉場
                        setTimeout(function(){
                          scheduleHint(0);
                          document.addEventListener('click',function onEnd(){
                            document.removeEventListener('click',onEnd);
                            hideHint();
                            startScene7();
                          });
                        },500);
                      });
                    }
                  });
                }
              });
            }
          });
        }
      });
    }
  });
  },1100);
}

/* ============ 月門缺字場景（原 7.html，同頁銜接） ============ */
/* 背景圖像素坐標（1536×2730 實測），對聯/橫批由 JS 依 cover 幾何定位 */
const BW=1536,BH=2730;
const P_LEFT={x:507,y:1037};
const P_RIGHT={x:1152,y:1037};
const P_HENG={x:768,y:369};

function placeOverlays7(){
  const W=window.innerWidth,H=window.innerHeight;
  const scale=Math.max(W/BW,H/BH);
  const bw=BW*scale,bh=BH*scale;
  const ox=(W-bw)/2, oy=(H-bh)/2;
  const toV=function(px,py){return {x:(ox+px*scale)/W*100,y:(oy+py*scale)/H*100};};
  const l=toV(P_LEFT.x,P_LEFT.y), r=toV(P_RIGHT.x,P_RIGHT.y), h=toV(P_HENG.x,P_HENG.y);
  const dlL=document.getElementById('dlLeft'), dlR=document.getElementById('dlRight'), heng=document.getElementById('hengpi');
  dlL.style.left=(l.x-1.5)+'%'; dlL.style.top=(l.y+2.5)+'%';
  dlR.style.left=(r.x+9)+'%'; dlR.style.top=(r.y+2.5)+'%';
  heng.style.left=h.x+'%';
  heng.style.top=Math.max(h.y,1.5)+'%';
}

/* 通用配音淡出（指定 id 清單）：舊聲在背景淡出，回調立即執行，新聲即刻起播 */
function fadeAudios(ids,cb){
  const audios=ids.map(function(id){return document.getElementById(id);}).filter(function(a){return a&&!a.paused;});
  audios.forEach(function(a){
    const step=(parseFloat(a.volume)||1)/6;
    const t=setInterval(function(){
      const nv=(parseFloat(a.volume)||1)-step;
      if(nv<=0.02){clearInterval(t);a.pause();a.currentTime=0;a.volume=1;}
      else{a.volume=nv;}
    },50);
  });
  if(cb)cb();
}

const dlgQueue7=[
  '這副對聯的最後一個字，不知何時，已經剝落了。',
  '有人猜「地」，有人猜「一」…… 可誰也拿不出證據。所以後人修復這宅子時，也只能留白。',
  '這個缺字，我先不告訴你。等你走完這一路，也許自己就找到答案了。',
  '現在，先跟著我往裡走吧。'
];
let dlg7Idx=0;

/* 起打一句：打完（或補完）後按配音時長顯示點擊提示（統一用 scheduleHint） */
function scene7Type(line,idx){
  typeWriter(document.getElementById('zhengText'),line,function(){
    const a=document.getElementById('zv'+(idx+1));
    const dur=(a&&a.duration)||0;
    scheduleHint(Math.max(dur*1000,300));
  });
}

function onScene7Click(){
  if(typeTimer){skipTypewriter();return;}   // 打字中：補完（onDone 照常排提示）
  dlg7Idx++;
  if(dlg7Idx>=dlgQueue7.length){
    hideHint();
    document.removeEventListener('click',onScene7Click);
    showInnerMap();
    return;
  }
  hideHint();
  fadeAudios(['zv1','zv2','zv3','zv4'],function(){
    const a=document.getElementById('zv'+(dlg7Idx+1));
    if(a){a.currentTime=0;a.play().catch(function(){});}
  });
  scene7Type(dlgQueue7[dlg7Idx],dlg7Idx);
}

/* 內院地圖：對話框收起、地圖自下方滑入（無黑幕） */
function showInnerMap(){
  const d=document.getElementById('zhengDialog');
  if(d)d.style.opacity='0';
  document.getElementById('mapSheet').classList.add('show');
}

/* 「已到達」：漸暗至全黑，接 10.html */
document.getElementById('arriveBtn').addEventListener('pointerdown',function(e){e.stopPropagation();});
document.getElementById('arriveBtn').addEventListener('click',function(e){
  e.stopPropagation();
  document.getElementById('fadeBlack').classList.add('show');
  setTimeout(function(){location.href='10.html';},950);
});

function startScene7(){
  const game=document.getElementById('game');
  game.classList.add('scene7');
  // 月門段元素還原隱藏
  ['moon','kids','shen','gui','zhegui'].forEach(function(id){
    const el=document.getElementById(id);
    el.classList.remove('show','away');
  });
  // 標籤更新為缺字場景
  const loc=document.getElementById('locLabel');
  loc.textContent='第二禮・月門缺字';
  loc.classList.add('show');
  // 對聯/橫批定位
  placeOverlays7();
  window.addEventListener('resize',placeOverlays7);
  // 直接繼續：橫批、對聯依次浮現（無黑幕轉場）
  setTimeout(function(){document.getElementById('hengpi').classList.add('show');},700);
  setTimeout(function(){
    document.getElementById('dlLeft').classList.add('show');
    document.getElementById('dlRight').classList.add('show');
  },1200);
  // 首句：淡出月門配音，立即起播第一句配音
  setTimeout(function(){
    dlg7Idx=0;
    hintToken=0;
    fadeAudios(['vo1','vo2','vo3','vo4','vo5','vo6'],function(){
      const z=document.getElementById('zv1');
      z.currentTime=0;z.play().catch(function(){});
    });
    scene7Type(dlgQueue7[0],0);
    document.addEventListener('click',onScene7Click);
  },1900);
}

window.addEventListener('load',()=>{
  // 開場自動：直接起月門段，背景由全黑漸漸亮起（.bg 自帶 .8s opacity 過渡）
  initMoonGate();
  requestAnimationFrame(function(){document.getElementById('bgA').classList.add('show');});
  // 若自動播放被瀏覽器攔截，首次點擊補播音頻（不顯示過場、不影響推進）
  let used=false;
  document.addEventListener('pointerdown',function firstTap(){
    if(used)return; used=true;
    document.removeEventListener('pointerdown',firstTap);
    resumeBgm();
    const vo=document.getElementById('vo1');
    if(vo&&vo.paused&&vo.currentTime<0.1){vo.play().catch(function(){});}
  });
});
</script>
</body>
